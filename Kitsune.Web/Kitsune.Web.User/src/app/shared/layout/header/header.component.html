<header class="top-bar">
  <button class="sidebar-toggle" type="button" (click)="toggleSidebar.emit()" [attr.aria-label]="sidebarCollapsed() ? 'Mở thanh điều hướng' : 'Thu gọn thanh điều hướng'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  @if (sidebarCollapsed()) {
    <a class="topbar-brand" (click)="router.navigate(['/home'])" aria-label="Về trang Tổng quan Kitsune">
      <span class="topbar-brand-mark"><img src="/LogoMark.png" alt="" /></span>
      <span>KITSUNE</span>
    </a>
  }

  <div class="topbar-context">
    <span class="context-eyebrow">Kitsune</span>
    <strong>{{ pageTitle }}</strong>
  </div>

  @if (showSearch) {
    <label class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.25 4.25"/></svg>
      <input type="search" placeholder="Tra từ vựng hoặc kanji..." [ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)" (keyup.enter)="onSearch()" />
      <kbd>⌘ K</kbd>
    </label>
  }

  <div class="top-actions">
    @if (dueSrsCount() > 0) {
      <button class="review-chip" type="button" (click)="router.navigate(['/srs'])"><span>🔥</span>{{ dueSrsCount() }} thẻ chờ</button>
    }
    <app-notification-bell />

    <div class="user-menu" [class.user-menu--open]="userMenuOpen()">
      <button class="user-menu-trigger" type="button" (click)="toggleUserMenu()" aria-haspopup="menu" [attr.aria-expanded]="userMenuOpen()">
        @if (avatarUrl) { <img class="user-avatar-img" [src]="avatarUrl" [alt]="'Ảnh đại diện của ' + displayName" /> }
        @else { <span class="user-avatar">{{ initials }}</span> }
        <span class="user-identity"><strong>{{ displayName }}</strong><small>{{ currentUser()?.email || 'Đang đồng bộ tài khoản' }}</small></span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 10 5 5 5-5"/></svg>
      </button>

      <div class="user-dropdown" role="menu">
        <div class="user-dropdown-header">
          @if (avatarUrl) { <img class="dropdown-avatar-img" [src]="avatarUrl" [alt]="displayName" /> }
          @else { <span class="dropdown-avatar">{{ initials }}</span> }
          <div><strong>{{ displayName }}</strong><span>{{ currentUser()?.email }}</span></div>
        </div>
        <div class="dropdown-divider"></div>
        <button type="button" class="dropdown-item" (click)="goToProfile()"><span>◎</span>Thông tin & ảnh đại diện</button>
        <button type="button" class="dropdown-item" (click)="goToProfile()"><span>⚙</span>Cài đặt tài khoản</button>
        <div class="dropdown-divider"></div>
        <button type="button" class="dropdown-item dropdown-item--danger" (click)="logout()"><span>↪</span>Đăng xuất</button>
      </div>
    </div>
  </div>
</header>
