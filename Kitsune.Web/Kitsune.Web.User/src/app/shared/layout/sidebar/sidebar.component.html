<div class="sidebar-overlay" [class.sidebar-overlay--visible]="!collapsed()" (click)="navClick.emit()"></div>

<aside class="sidebar" [class.sidebar--collapsed]="collapsed()" [class.sidebar--expanded]="!collapsed()">
  <a class="sidebar-brand" routerLink="/home" (click)="navClick.emit()" aria-label="Về trang Tổng quan Kitsune">
    <span class="brand-mark" aria-hidden="true"><img src="/Logo.png" alt="" /></span>
    <span class="brand-copy"><strong>KITSUNE</strong><small>Học tiếng Nhật</small></span>
  </a>

  <nav class="sidebar-nav" aria-label="Điều hướng chính">
    @for (item of primaryNavItems; track item.id) {
      <a class="nav-link" [class.nav-link--active]="isActive(item)" [routerLink]="item.route" [attr.aria-label]="item.label"
        [attr.title]="collapsed() ? item.label : null" (click)="navClick.emit()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" [innerHTML]="svgIcon(item.icon)"></svg>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-reward" [attr.title]="collapsed() ? streak() + ' ngày liên tiếp' : null">
    <span class="reward-flame">🔥</span><span class="reward-copy"><strong>{{ streak() }}</strong> ngày liên tiếp</span>
  </div>

  <nav class="sidebar-utility" aria-label="Điều hướng tài khoản">
    @for (item of utilityNavItems; track item.id) {
      <a class="nav-link nav-link--utility" [class.nav-link--active]="isActive(item)" [routerLink]="item.route"
        [attr.aria-label]="item.label" [attr.title]="collapsed() ? item.label : null" (click)="navClick.emit()">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" [innerHTML]="svgIcon(item.icon)"></svg>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>
