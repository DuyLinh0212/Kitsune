<section class="lookup-frame" aria-label="Tra cứu tiếng Nhật">
  <div class="lookup-frame__meta">
    <span>KITSUNE / TRA CỨU</span>
    @if (resultCount() !== null) {
      <strong>{{ resultCount() }} kết quả</strong>
    }
  </div>

  <div class="lookup-frame__search">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
      <circle cx="11" cy="11" r="7.25" /><path d="m16.3 16.3 4.7 4.7" />
    </svg>
    <input type="search" [value]="query()" [placeholder]="placeholder()" (input)="onInput($event)" (keyup.enter)="search.emit()" autocomplete="off" autocorrect="off" spellcheck="false" />
    @if (query()) {
      <button type="button" class="lookup-frame__clear" (click)="clear()" aria-label="Xóa từ khóa">×</button>
    }
    <div class="lookup-frame__tools"><ng-content select="[lookup-frame-tools]"></ng-content></div>
    <button type="button" class="lookup-frame__submit" (click)="search.emit()">Tra cứu</button>
  </div>

  <nav class="lookup-frame__tabs" aria-label="Loại nội dung tra cứu">
    @for (tab of tabs; track tab.id) {
      <a [routerLink]="tab.route" [class.lookup-frame__tab--active]="activeMode() === tab.id">{{ tab.label }}</a>
    }
  </nav>
</section>
